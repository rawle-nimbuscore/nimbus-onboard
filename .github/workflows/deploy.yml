name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until AWS is connected
        id: gate
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, then run this workflow again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.gate.outputs.ready == 'true'
        id: login
      - name: Build and push the image
        if: steps.gate.outputs.ready == 'true'
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          REPOSITORY: nimbus-onboard
        run: |
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
